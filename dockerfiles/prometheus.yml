global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          namespace: docker
          endpoint: prometheus

  - job_name: 'ms-users'
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'ms-email'
    static_configs:
      - targets: ['host.docker.internal:3002']
